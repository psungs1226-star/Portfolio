<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PDF 규정 챗봇</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f8f9fa;--surface:#fff;--text:#1a1a2e;--text-secondary:#6c757d;
  --border:#e9ecef;--accent:#3b82f6;--accent-hover:#2563eb;
  --user-bg:#3b82f6;--user-text:#fff;
  --bot-bg:#f1f3f5;--bot-text:#1a1a2e;
  --source-bg:#f8f9fa;--source-border:#dee2e6;
  --radius:12px;--shadow:0 1px 3px rgba(0,0,0,.08);
}
@media(prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1117;--surface:#1a1b26;--text:#e2e8f0;--text-secondary:#94a3b8;
    --border:#2d3748;--accent:#60a5fa;--accent-hover:#93bbfd;
    --user-bg:#2563eb;--user-text:#fff;
    --bot-bg:#1e293b;--bot-text:#e2e8f0;
    --source-bg:#1e293b;--source-border:#334155;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1117;--surface:#1a1b26;--text:#e2e8f0;--text-secondary:#94a3b8;
  --border:#2d3748;--accent:#60a5fa;--accent-hover:#93bbfd;
  --user-bg:#2563eb;--user-text:#fff;
  --bot-bg:#1e293b;--bot-text:#e2e8f0;
  --source-bg:#1e293b;--source-border:#334155;
}
html,body{height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);color:var(--text);display:flex;flex-direction:column;
}
.topbar{
  position:sticky;top:0;z-index:10;
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:.75rem 1.25rem;display:flex;align-items:center;gap:.75rem;
  box-shadow:var(--shadow);
}
.topbar-brand{font-weight:700;font-size:1.1rem}
.topbar-meta{font-size:.8rem;color:var(--text-secondary)}
.topbar-dot{
  display:inline-block;width:6px;height:6px;border-radius:50%;
  margin-right:4px;vertical-align:middle;
}
.topbar-dot.online{background:#22c55e}
.topbar-dot.offline{background:var(--text-secondary)}

.chat-area{
  flex:1;overflow-y:auto;padding:1.5rem 1rem;
  display:flex;flex-direction:column;gap:1rem;
  max-width:800px;width:100%;margin:0 auto;
}

.empty-state{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;text-align:center;gap:.75rem;padding:2rem;
}
.empty-icon{font-size:3rem;opacity:.4}
.empty-title{font-size:1.25rem;font-weight:600}
.empty-desc{color:var(--text-secondary);font-size:.9rem;max-width:360px}

.msg{display:flex;gap:.625rem;max-width:85%}
.msg.user{align-self:flex-end;flex-direction:row-reverse}
.msg.bot{align-self:flex-start}

.msg-bubble{
  padding:.75rem 1rem;border-radius:var(--radius);
  line-height:1.6;font-size:.925rem;white-space:pre-wrap;word-break:break-word;
}
.msg.user .msg-bubble{background:var(--user-bg);color:var(--user-text);border-bottom-right-radius:4px}
.msg.bot .msg-bubble{background:var(--bot-bg);color:var(--bot-text);border-bottom-left-radius:4px}

.msg-avatar{
  width:32px;height:32px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
  font-size:.8rem;font-weight:700;
}
.msg.bot .msg-avatar{background:var(--accent);color:#fff}

.sources{margin-top:.5rem}
.sources-toggle{
  background:none;border:none;color:var(--accent);cursor:pointer;
  font-size:.8rem;padding:.25rem 0;display:flex;align-items:center;gap:.25rem;
}
.sources-toggle:hover{text-decoration:underline}
.sources-list{
  display:none;margin-top:.375rem;
  border:1px solid var(--source-border);border-radius:8px;overflow:hidden;
}
.sources-list.open{display:block}
.source-item{
  padding:.625rem .75rem;border-bottom:1px solid var(--source-border);
  background:var(--source-bg);font-size:.825rem;
}
.source-item:last-child{border-bottom:none}
.source-meta{color:var(--text-secondary);font-size:.75rem;margin-bottom:.25rem}
.source-text{line-height:1.5}

.loading-dots{display:flex;gap:4px;padding:4px 0}
.loading-dots span{
  width:6px;height:6px;border-radius:50%;background:var(--text-secondary);
  animation:bounce .6s ease-in-out infinite;
}
.loading-dots span:nth-child(2){animation-delay:.1s}
.loading-dots span:nth-child(3){animation-delay:.2s}
@keyframes bounce{0%,80%,100%{opacity:.3}40%{opacity:1}}

.composer{
  position:sticky;bottom:0;background:var(--surface);
  border-top:1px solid var(--border);padding:.75rem 1rem;
}
.composer-inner{
  max-width:800px;margin:0 auto;display:flex;gap:.5rem;align-items:flex-end;
}
.composer textarea{
  flex:1;resize:none;border:1px solid var(--border);border-radius:var(--radius);
  padding:.625rem .875rem;font-size:.925rem;font-family:inherit;
  background:var(--bg);color:var(--text);line-height:1.5;
  max-height:120px;outline:none;transition:border-color .15s;
}
.composer textarea:focus{border-color:var(--accent)}
.composer button{
  padding:.625rem 1.25rem;border:none;border-radius:var(--radius);
  background:var(--accent);color:#fff;font-size:.925rem;font-weight:600;
  cursor:pointer;white-space:nowrap;transition:background .15s;
}
.composer button:hover{background:var(--accent-hover)}
.composer button:disabled{opacity:.5;cursor:not-allowed}
.msg-bubble ul{margin:.375rem 0;padding-left:1.25rem}
.msg-bubble li{margin:.125rem 0}
.msg-bubble strong{font-weight:600}
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-brand">PDF 규정 챗봇</span>
  <span class="topbar-meta">
    <span class="topbar-dot {{ 'online' if profile == 'local' else 'offline' }}"></span>
    {{ profile }} · 문서 {{ doc_count }}건 인덱싱
  </span>
</div>

<div class="chat-area" id="chat">
  <div class="empty-state" id="empty">
    <div class="empty-icon">📄</div>
    <div class="empty-title">무엇을 확인할까요?</div>
    <div class="empty-desc">
      documents/ 폴더의 PDF 규정을 기반으로 답변합니다.
      {% if profile == 'offline' %}검색 결과만 표시됩니다.{% else %}Ollama(qwen3:4b)로 답변을 생성합니다.{% endif %}
    </div>
  </div>
</div>

<form class="composer" id="form">
  <div class="composer-inner">
    <textarea id="input" rows="1" placeholder="질문을 입력하세요..." required></textarea>
    <button type="submit" id="send">전송</button>
  </div>
</form>

<script>
const chat = document.getElementById('chat');
const form = document.getElementById('form');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const empty = document.getElementById('empty');
let sessionId = null;
let busy = false;

input.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

input.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    form.dispatchEvent(new Event('submit'));
  }
});

form.addEventListener('submit', async function(e) {
  e.preventDefault();
  const msg = input.value.trim();
  if (!msg || busy) return;

  if (empty) empty.remove();
  busy = true;
  sendBtn.disabled = true;

  appendUser(msg);
  input.value = '';
  input.style.height = 'auto';

  const loadingEl = appendLoading();

  try {
    const resp = await fetch('/api/chat', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({message: msg, session_id: sessionId}),
    });
    const data = await resp.json();
    sessionId = data.session_id;
    loadingEl.remove();
    appendBot(data.answer, data.sources);
  } catch {
    loadingEl.remove();
    appendBot('서버 연결에 실패했습니다.', []);
  }
  busy = false;
  sendBtn.disabled = false;
  input.focus();
});

function appendUser(text) {
  const el = document.createElement('div');
  el.className = 'msg user';
  el.innerHTML = '<div class="msg-bubble"></div>';
  el.querySelector('.msg-bubble').textContent = text;
  chat.appendChild(el);
  scrollBottom();
}

function appendBot(text, sources) {
  const el = document.createElement('div');
  el.className = 'msg bot';

  let html = '<div class="msg-avatar">AI</div><div><div class="msg-bubble"></div>';
  if (sources && sources.length > 0) {
    html += '<div class="sources">';
    html += '<button type="button" class="sources-toggle" onclick="this.nextElementSibling.classList.toggle(\'open\')">&#9654; 근거 ' + sources.length + '건</button>';
    html += '<div class="sources-list">';
    for (const s of sources) {
      html += '<div class="source-item">';
      html += '<div class="source-meta">' + esc(s.file) + ' · p.' + s.page + ' · 유사도 ' + s.score + '</div>';
      html += '<div class="source-text">' + esc(s.text) + '</div>';
      html += '</div>';
    }
    html += '</div></div>';
  }
  html += '</div>';
  el.innerHTML = html;
  el.querySelector('.msg-bubble').innerHTML = md(text);
  chat.appendChild(el);
  scrollBottom();
}

function md(text) {
  let s = esc(text);
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\*(.+?)\*/g, '<em>$1</em>');
  s = s.replace(/^- (.+)$/gm, '<li>$1</li>');
  s = s.replace(/((?:<li>.*<\/li>\s*)+)/g, '<ul>$1</ul>');
  s = s.replace(/\n/g, '<br>');
  return s;
}

function appendLoading() {
  const el = document.createElement('div');
  el.className = 'msg bot';
  el.innerHTML = '<div class="msg-avatar">AI</div><div class="msg-bubble"><div class="loading-dots"><span></span><span></span><span></span></div></div>';
  chat.appendChild(el);
  scrollBottom();
  return el;
}

function scrollBottom() {
  chat.scrollTop = chat.scrollHeight;
}

function esc(s) {
  const d = document.createElement('div');
  d.textContent = s;
  return d.innerHTML;
}

input.focus();
</script>
</body>
</html>
