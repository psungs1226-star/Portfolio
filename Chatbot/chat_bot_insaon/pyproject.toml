[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "insaon"
version = "0.1.0"
description = "Public-regulation review support prototype for local-government leave questions"
readme = "README.md"
requires-python = ">=3.12,<3.15"
license = {text = "Portfolio prototype"}
authors = [{name = "InsaON project"}]
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "jinja2>=3.1,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8,<10",
  "ruff>=0.9,<1",
]

[project.scripts]
insaon-api = "insaon.api.main:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
insaon = [
  "web/templates/*.html",
  "web/static/*.css",
  "web/static/*.js",
  "web/static/fonts/*.woff2",
  "web/static/fonts/*.md",
]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["insaon"]

[[tool.mypy.overrides]]
module = ["uvicorn"]
ignore_missing_imports = true
